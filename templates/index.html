<!DOCTYPE html>
<html>
<head>
    <title>AI Governance Agent</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
   <header class="site-header">
    <a class="site-brand" href="/">
        <img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="24" height="24" style="vertical-align: middle; margin-right: 8px;">
        AI Governance Agent
    </a>
    <nav class="site-nav">
        <a href="https://github.com/zulfaalbalushi/governance-agent" target="_blank" rel="noopener">GitHub &#8599;</a>
    </nav>
</header>

    <div class="app-shell">
        <header class="app-header">
            <div class="eyebrow">AI Governance Agent</div>
            <h1>Ask about policy, compliance, and responsible AI practice.</h1>
            <p>Concise, grounded answers in a quiet interface designed for longer governance work.</p>
        </header>

        <main class="chat-container" aria-label="Chat conversation">
            <div id="messages" class="messages" role="log" aria-live="polite"></div>

            <section id="suggested-prompts" class="suggested-prompts" aria-label="Suggested prompts">
                <button class="suggestion" type="button">What are the ethical principles for AI in Oman?</button>
                <button class="suggestion" type="button">What are the data retention requirements?</button>
            </section>
        </main>
    </div>

    <form id="input-area" class="composer" autocomplete="off">
        <div class="composer-inner">
            <input type="text" id="question-input" placeholder="Ask about AI governance..." aria-label="Ask a question">
            <button id="send-button" type="submit">Send</button>
        </div>
    </form>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
